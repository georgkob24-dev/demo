жалась 😅"], [1, "Артём", "Я знал, что фото с пакетом пельменей когда-нибудь изменит мою жизнь."], [3, "Алиса", "Подожди. Ты правда считаешь это удачной фотографией?"], [3, "Артём", "Не просто удачной. Это мой главный козырь."], [3, "Алиса", "Ахах. Ладно, убедил. Как проходит вечер?"], [4, "Рассказчик", "Разговор, который должен был закончиться через пять минут, затянулся до двух ночи."], [4, "Артём", "У тебя завтра вообще-то дела. И у меня тоже."], [4, "Алиса", "Знаю. Но если я сейчас напишу «спокойной ночи», ты ведь ответишь?"], [3, "Артём", "Смотря сколько в этом сообщении будет букв."], [3, "Алиса", "Спокооооойной ночииии 🌙"], [4, "Рассказчик", "Они оба улыбались в темноте. Каждый — своему экрану."], [1, "Артём", "Кажется, у меня появилась очень странная привычка."], [3, "Алиса", "Какая?"], [1, "Артём", "Проверять телефон, даже когда он не вибрировал."], [3, "Алиса", "У меня тоже. Совпадение?"], [4, "Рассказчик", "Прошло несколько недель. Были голосовые, бесконечные мемы, разговоры о детстве и о том, чего они боялись сказать вслух."], [5, "Алиса", "Слушай… а мы так и будем общаться только через экран?"], [1, "Артём", "Я как раз собирался предложить встретиться. Уже третий день собираюсь."], [5, "Алиса", "Ничего себе скорость. Я согласна 😄"], [4, "Рассказчик", "В день встречи дождь начался ровно за двадцать минут до назначенного времени."], [5, "Артём", "Я на месте. Чёрная куртка, максимально уверенный вид. Внутри паника."], [5, "Алиса", "Я тебя вижу. Уверенный вид пока не обнаружен."], [5, "Рассказчик", "А потом они посмотрели друг на друга — и неловкость почему-то стала совсем не страшной."], [5, "Артём", "Ты в жизни ещё красивее, чем на фотографиях."], [5, "Алиса", "А ты в жизни ещё смешнее. Даже молча."], [6, "Рассказчик", "Кофе остыл. Дождь закончился. Они даже не заметили, как наступил вечер."], [6, "Алиса", "Знаешь, я сегодня боялась, что нам будет не о чем говорить."], [6, "Артём", "А теперь я боюсь, что этот вечер закончится."], [7, "Рассказчик", "Они поднялись на смотровую площадку. Внизу мерцал город, а над ними медленно загорались звёзды."], [7, "Алиса", "Если бы я тогда не написала тебе…"], [7, "Артём", "Я всё равно рад, что ты написала."], [7, "Алиса", "Я тоже. Очень."], [8, "Рассказчик", "Но это был не конец истории. Артём протянул Алисе маленький конверт."], [8, "Артём", "Я хотел сказать кое-что без шуток. Спасибо, что появилась в моей жизни. С тобой даже обычные дни стали особенными."], [8, "Артём", "И если ты не против… давай напишем ещё много глав вместе."], [8, "Алиса", "Я уже согласилась. Ещё в тот вечер, когда написала «привет». ❤️"]];let index=0,typing=false,timer=null,shown='',audio=null,musicOn=true,notes=[],beatTimer=null;
const $=x=>document.getElementById(x);function startMusic(){if(!musicOn)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume();if(beatTimer)return;let tick=0;const chords=[[220,261.63,329.63],[196,246.94,293.66],[174.61,220,261.63],[196,246.94,329.63]];function play(){if(!audio||!musicOn)return;const now=audio.currentTime;const chord=chords[Math.floor(tick/4)%4];for(let k=0;k<3;k++){let osc=audio.createOscillator(),gain=audio.createGain();osc.type='sine';osc.frequency.value=chord[k]*(k===0?.5:1);gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(.018,now+.15);gain.gain.exponentialRampToValueAtTime(.0001,now+2.3);osc.connect(gain).connect(audio.destination);osc.start(now);osc.stop(now+2.35)}tick++}play();beatTimer=setInterval(play,2400)}catch(e){}}function stopMusic(){if(beatTimer){clearInterval(beatTimer);beatTimer=null}if(audio)audio.suspend()}
function render(){let [img,name,text]=story[index];$('scene').classList.add('fade');setTimeout(()=>{$('scene').style.backgroundImage=`url("${images[img]}")`;$('scene').classList.remove('fade')},150);$('rain').style.display=img===4?'block':'none';$('speaker').textContent=name;$('chapter').textContent=(index<9?'Глава 1 · Сообщение':index<19?'Глава 2 · Привычка':index<28?'Глава 3 · Встреча':index<35?'Глава 4 · Этот вечер':'Глава 5 · Продолжение');$('progress').style.width=((index+1)/story.length*100)+'%';shown=text;$('line').textContent='';typing=true;clearInterval(timer);let i=0;timer=setInterval(()=>{i=Math.min(i+2,text.length);$('line').textContent=text.slice(0,i);if(i>=text.length){clearInterval(timer);typing=false}},25);try{localStorage.setItem('pixel-love-progress',index)}catch(e){}}
function advance(){if($('overlay').style.display!=='none')return;if(typing){clearInterval(timer);$('line').textContent=shown;typing=false;return}if(index<story.length-1){index++;render()}else{end()}}function end(){$('overlay').style.display='flex';$('overlay').innerHTML='<div class="panel"><div class="endheart">♥</div><h1>Продолжение следует…</h1><p>Иногда самая важная история начинается с простого «привет».</p><p>Артём ♡ Алиса</p><button class="primary" id="again">Пройти ещё раз</button></div>';$('again').onclick=()=>{index=0;$('overlay').style.display='none';render()}}$('start').onclick=()=>{$('overlay').style.display='none';index=0;render();startMusic()};$('dialog').onclick=advance;$('dialog').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();advance()}};$('restart').onclick=()=>{index=0;$('overlay').style.display='none';render();startMusic()};$('music').onclick=()=>{musicOn=!musicOn;$('music').textContent=musicOn?'♫ Вкл.':'♫ Выкл.';if(musicOn)startMusic();else stopMusic()};$('scene').style.backgroundImage=`url("${images[0]}")`;
