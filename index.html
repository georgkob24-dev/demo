log.alice{--speaker:#ed91bd}.speaker{position:absolute;top:-16px;left:17px;padding:7px 17px;background:#242238;border:2px solid var(--speaker);color:var(--speaker);border-radius:8px;font-weight:700;font-size:13px;box-shadow:0 3px 12px #0008}.line{font-size:clamp(15px,2.4vw,20px);line-height:1.65;white-space:pre-wrap;text-shadow:0 1px 2px #000}.next{position:absolute;bottom:8px;right:16px;color:var(--speaker);animation:pulse 1.1s infinite}@keyframes pulse{50%{opacity:.3;transform:translateY(4px)}}.progress{position:absolute;top:0;left:0;height:3px;background:#ff9fc1;z-index:5;transition:width .3s}.overlay{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:linear-gradient(#12112255,#111020bb);padding:22px}.panel{width:min(480px,100%);text-align:center;background:#18172bdc;border:2px solid #d48baf;border-radius:14px;padding:34px 22px;box-shadow:0 15px 60px #000b;backdrop-filter:blur(6px)}h1{font-size:clamp(32px,7vw,56px);margin:0 0 12px;color:#ffe0ec;text-shadow:3px 3px #8b446f}p{line-height:1.6;color:#e2d6e2}.primary{display:block;width:100%;margin-top:18px;padding:15px;border-radius:10px;border:2px solid #ffc2dc;background:#a34b76;color:white;font-weight:bold;box-shadow:0 4px #5a2c50}.primary:active{transform:translateY(3px);box-shadow:0 1px #5a2c50}.hint{font-size:12px;opacity:.75}.endheart{font-size:52px;animation:pulse 2s infinite}@media(max-width:600px){.game{max-width:none}.scene{background-size:cover;background-position:center 36%}.top{padding:calc(8px + env(safe-area-inset-top)) 10px 8px;gap:8px}.chapter{font-size:9px;letter-spacing:1px;max-width:42%;line-height:1.35}.tools{gap:5px}.tools button{min-width:42px;min-height:40px;padding:7px 8px;font-size:11px}.dialog{left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));min-height:clamp(142px,25dvh,205px);max-height:42dvh;overflow-y:auto;padding:24px 15px 27px;border-radius:11px}.speaker{top:-14px;left:12px;padding:6px 13px;font-size:12px}.line{font-size:clamp(14px,3.9vw,17px);line-height:1.48;padding-right:8px}.next{position:sticky;float:right;bottom:0;margin-top:-4px;margin-right:0;font-size:16px}.overlay{padding:16px;padding-top:max(16px,env(safe-area-inset-top));padding-bottom:max(16px,env(safe-area-inset-bottom))}.panel{max-height:90dvh;overflow-y:auto;padding:27px 18px;border-radius:13px}.primary{min-height:48px;padding:13px}.progress{height:3px}}@media(max-width:380px){.chapter{font-size:8px}.tools button{min-width:38px;padding:6px;font-size:10px}.dialog{left:8px;right:8px;padding-left:13px;padding-right:13px}.line{font-size:14px}}@media(orientation:landscape) and (max-height:500px){.top{padding:6px 10px}.dialog{left:18%;right:18%;bottom:8px;min-height:92px;max-height:42vh;padding:20px 18px 22px}.line{font-size:14px;line-height:1.35}.speaker{top:-13px;padding:5px 12px}.overlay{padding:8px}.panel{padding:16px 20px}.panel p{margin:7px 0}}

 Из тех, которые забываются уже на следующий день. Но этот почему-то останется с Артёмом навсегда."], [1, "Артём", "Так. Ещё пять минут в интернете — и спать. Точно."], [2, "Рассказчик", "На экране появилось уведомление. Незнакомое имя: Алиса."], [2, "Алиса", "Привет! Это немного внезапно, но у тебя в профиле такая смешная фотография… Я не удержалась 😅"], [1, "Артём", "Я знал, что фото с пакетом пельменей когда-нибудь изменит мою жизнь."], [3, "Алиса", "Подожди. Ты правда считаешь это удачной фотографией?"], [3, "Артём", "Не просто удачной. Это мой главный козырь."], [3, "Алиса", "Ахах. Ладно, убедил. Как проходит вечер?"], [4, "Рассказчик", "Разговор, который должен был закончиться через пять минут, затянулся до двух ночи."], [4, "Артём", "У тебя завтра вообще-то дела. И у меня тоже."], [4, "Алиса", "Знаю. Но если я сейчас напишу «спокойной ночи», ты ведь ответишь?"], [3, "Артём", "Смотря сколько в этом сообщении будет букв."], [3, "Алиса", "Спокооооойной ночииии 🌙"], [4, "Рассказчик", "Они оба улыбались в темноте. Каждый — своему экрану."], [1, "Артём", "Кажется, у меня появилась очень странная привычка."], [3, "Алиса", "Какая?"], [1, "Артём", "Проверять телефон, даже когда он не вибрировал."], [3, "Алиса", "У меня тоже. Совпадение?"], [4, "Рассказчик", "Прошло несколько недель. Были голосовые, бесконечные мемы, разговоры о детстве и о том, чего они боялись сказать вслух."], [5, "Алиса", "Слушай… а мы так и будем общаться только через экран?"], [1, "Артём", "Я как раз собирался предложить встретиться. Уже третий день собираюсь."], [5, "Алиса", "Ничего себе скорость. Я согласна 😄"], [4, "Рассказчик", "В день встречи дождь начался ровно за двадцать минут до назначенного времени."], [5, "Артём", "Я на месте. Чёрная куртка, максимально уверенный вид. Внутри паника."], [5, "Алиса", "Я тебя вижу. Уверенный вид пока не обнаружен."], [5, "Рассказчик", "А потом они посмотрели друг на друга — и неловкость почему-то стала совсем не страшной."], [5, "Артём", "Ты в жизни ещё красивее, чем на фотографиях."], [5, "Алиса", "А ты в жизни ещё смешнее. Даже молча."], [6, "Рассказчик", "Кофе остыл. Дождь закончился. Они даже не заметили, как наступил вечер."], [6, "Алиса", "Знаешь, я сегодня боялась, что нам будет не о чем говорить."], [6, "Артём", "А теперь я боюсь, что этот вечер закончится."], [7, "Рассказчик", "Они поднялись на смотровую площадку. Внизу мерцал город, а над ними медленно загорались звёзды."], [7, "Алиса", "Если бы я тогда не написала тебе…"], [7, "Артём", "Я всё равно рад, что ты написала."], [7, "Алиса", "Я тоже. Очень."], [8, "Рассказчик", "Но это был не конец истории. Артём протянул Алисе маленький конверт."], [8, "Артём", "Я хотел сказать кое-что без шуток. Спасибо, что появилась в моей жизни. С тобой даже обычные дни стали особенными."], [8, "Артём", "И если ты не против… давай напишем ещё много глав вместе."], [8, "Алиса", "Я уже согласилась. Ещё в тот вечер, когда написала «привет». ❤️"]];let index=0,typing=false,timer=null,shown='',audio=null,musicOn=true,notes=[],beatTimer=null;
const $=x=>document.getElementById(x);function startMusic(){if(!musicOn)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume();if(beatTimer)return;let tick=0;const chords=[[220,261.63,329.63],[196,246.94,293.66],[174.61,220,261.63],[196,246.94,329.63]];function play(){if(!audio||!musicOn)return;const now=audio.currentTime;const chord=chords[Math.floor(tick/4)%4];for(let k=0;k<3;k++){let osc=audio.createOscillator(),gain=audio.createGain();osc.type='sine';osc.frequency.value=chord[k]*(k===0?.5:1);gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(.018,now+.15);gain.gain.exponentialRampToValueAtTime(.0001,now+2.3);osc.connect(gain).connect(audio.destination);osc.start(now);osc.stop(now+2.35)}tick++}play();beatTimer=setInterval(play,2400)}catch(e){}}function stopMusic(){if(beatTimer){clearInterval(beatTimer);beatTimer=null}if(audio)audio.suspend()}
function render(){let [img,name,text]=story[index];$('scene').classList.add('fade');setTimeout(()=>{$('scene').style.backgroundImage=`url("${images[img]}")`;$('scene').classList.remove('fade')},150);$('rain').style.display=img===4?'block':'none';const dialog=$('dialog');dialog.classList.remove('narrator','artem','alice');dialog.classList.add(name==='Рассказчик'?'narrator':name==='Артём'?'artem':'alice');$('speaker').textContent=name;$('chapter').textContent=(index<9?'Глава 1 · Сообщение':index<19?'Глава 2 · Привычка':index<28?'Глава 3 · Встреча':index<35?'Глава 4 · Этот вечер':'Глава 5 · Продолжение');$('progress').style.width=((index+1)/story.length*100)+'%';shown=text;$('line').textContent='';typing=true;clearInterval(timer);let i=0;timer=setInterval(()=>{i=Math.min(i+2,text.length);$('line').textContent=text.slice(0,i);if(i>=text.length){clearInterval(timer);typing=false}},25);try{localStorage.setItem('pixel-love-progress',index)}catch(e){}}
function advance(){if($('overlay').style.display!=='none')return;if(typing){clearInterval(timer);$('line').textContent=shown;typing=false;return}if(index<story.length-1){index++;render()}else{end()}}function end(){$('overlay').style.display='flex';$('overlay').innerHTML='<div class="panel"><div class="endheart">♥</div><h1>Продолжение следует…</h1><p>Иногда самая важная история начинается с простого «привет».</p><p>Артём ♡ Алиса</p><button class="primary" id="again">Пройти ещё раз</button></div>';$('again').onclick=()=>{index=0;$('overlay').style.display='none';render()}}$('start').onclick=()=>{$('overlay').style.display='none';index=0;render();startMusic()};$('dialog').onclick=advance;$('dialog').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();advance()}};$('restart').onclick=()=>{index=0;$('overlay').style.display='none';render();startMusic()};$('music').onclick=()=>{musicOn=!musicOn;$('music').textContent=musicOn?'♫ Вкл.':'♫ Выкл.';if(musicOn)startMusic();else stopMusic()};$('scene').style.backgroundImage=`url("${images[0]}")`;
